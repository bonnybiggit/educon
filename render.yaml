services:
  - type: web
    name: universe-consult-website
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.13.1
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: educon
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_NAME
        value: Super Admin
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
