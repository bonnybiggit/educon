services:
  - type: web
    name: universe-consult-website
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.13.1
      - key: VITE_SITE_URL
        value: https://universeconsultsedu.com
      - key: VITE_API_BASE_URL
        value: https://universeconsultsedu.com
      - key: FRONTEND_URL
        value: https://universeconsultsedu.com
      - key: CORS_ORIGINS
        value: https://universeconsultsedu.com
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Universe Consult <support@universeconsultsedu.com>"
      - key: EMAIL_VERIFICATION_CODE_PEPPER
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: educon
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_NAME
        value: Super Admin
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
